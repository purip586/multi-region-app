<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Region</title>
</head>
<body>
  <pre id="results">...</pre>
  <script>
    fetch('/api/region')
      .then(function (r) { return r.text(); })
      .then(function (text) {
        document.getElementById('results').textContent = text;
      })
      .catch(function () {
        document.getElementById('results').textContent = 'error';
      });
  </script>
</body>
</html>
